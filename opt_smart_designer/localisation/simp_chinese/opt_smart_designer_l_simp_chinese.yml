 opt_plane_desc_7:0 "§G方案：远洋双发重型战斗机（Medium Airframe）§!\n超大航程覆盖太平洋/苏德大空区，双发高推力挂载多组重机枪/机炮与副油箱。"
 opt_ship_desc_dd_torp:0 "§G方案：鱼雷雷击驱逐舰（Torpedo DD）§!\n3 组满载最新鱼雷发射管，配合软攻轻巡清完敌方屏卫后瞬间雷击击沉敌方主力舰。"
 opt_div_desc_6:0 "§G方案：25 宽精锐山地师（8山地 + 3炮）§!\n完美契合山地 25/50/75 战斗宽度，自动配齐工兵/支援炮/防空/侦察/后勤。"
 opt_div_desc_7:0 "§G方案：30 宽抢滩海军陆战师（12陆战 + 2炮）§!\n两栖登陆与跨河突击核心，自动优先挂载工兵连与中坦喷火连。"
 opt_div_desc_8:0 "§G方案：治安宪兵骑兵师（10骑兵 + 宪兵连）§!\n镇压占领区抵抗的最低装备/人力消耗模板。"
